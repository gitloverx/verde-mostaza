<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4a017">
<title>Verde Mostaza</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#fef8e7',100:'#fcefc8',600:'#d4a017',700:'#a87f0f',900:'#3f2f05'}},fontFamily:{sans:['Inter','sans-serif']}}}}</script>
</head>
<body class="bg-stone-100 text-stone-800 font-sans min-h-screen flex flex-col">
<main class="flex-1 flex flex-col items-center justify-center px-4 py-8">
<div class="w-16 h-16 bg-gradient-to-br from-amber-400 to-amber-600 text-white rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-xl shadow-amber-500/30">
<i class="fa-solid fa-seedling"></i>
</div>
<h1 class="font-black text-2xl text-stone-900 tracking-tight text-center">VERDE MOSTAZA</h1>
<p class="text-xs text-stone-500 text-center mt-1 mb-6">Tu puesto de comida, organizado.</p>

<div class="w-full max-w-sm bg-white p-6 rounded-3xl shadow-xl border border-stone-200">
    <div id="form-login" class="space-y-4">
        <h2 class="font-bold text-lg text-stone-900 mb-4">Iniciar Sesión</h2>
        <div>
            <input type="email" id="login-email" placeholder="Correo electrónico" class="w-full bg-stone-100 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-600 transition">
        </div>
        <div>
            <input type="password" id="login-pass" placeholder="Contraseña" class="w-full bg-stone-100 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-600 transition">
        </div>
        <button onclick="handleLogin()" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition">Entrar</button>
        <div class="flex justify-between items-center text-xs mt-2">
            <a href="#" onclick="toggleForms('register')" class="text-amber-600 font-bold hover:underline">Crear cuenta</a>
            <a href="#" onclick="handleReset()" class="text-stone-400 hover:text-stone-600">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <div id="form-register" class="hidden space-y-4">
        <h2 class="font-bold text-lg text-stone-900 mb-4">Crear Cuenta</h2>
        <div>
            <input type="text" id="reg-name" placeholder="Tu nombre o negocio" class="w-full bg-stone-100 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-600 transition">
        </div>
        <div>
            <input type="email" id="reg-email" placeholder="Correo electrónico" class="w-full bg-stone-100 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-600 transition">
        </div>
        <div>
            <input type="password" id="reg-pass" placeholder="Contraseña (mín. 8 caracteres)" class="w-full bg-stone-100 border border-stone-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-600 transition">
        </div>
        <button onclick="handleRegister()" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition">Registrarse</button>
        <div class="text-center text-xs mt-2">
            <a href="#" onclick="toggleForms('login')" class="text-stone-500 hover:text-stone-700 font-bold">Volver a iniciar sesión</a>
        </div>
    </div>

    <div class="flex items-center my-5">
        <div class="flex-1 border-t border-stone-200"></div>
        <span class="px-3 text-[10px] text-stone-400 font-bold uppercase tracking-wider">O</span>
        <div class="flex-1 border-t border-stone-200"></div>
    </div>

    <button onclick="handleGoogle()" class="w-full bg-white hover:bg-stone-50 text-stone-900 font-bold py-3 rounded-xl text-sm shadow-sm border border-stone-200 flex items-center justify-center gap-3 transition">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuar con Google
    </button>
    <p id="status" class="text-[11px] text-stone-400 text-center mt-4"></p>
</div>
</main>

<script src="firebase-config.js"></script>
<script type="module">
import { signInWithGoogle, watchAuth, signInWithEmail, registerWithEmail, resetPassword } from "./js/auth.js";

window.toggleForms = (form) => {
    if (form === 'register') {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-register').classList.remove('hidden');
    } else {
        document.getElementById('form-register').classList.add('hidden');
        document.getElementById('form-login').classList.remove('hidden');
    }
}

window.handleLogin = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    if(!email || !pass) return alert("Llena todos los campos");
    document.getElementById('status').textContent = "Conectando...";
    try {
        await signInWithEmail(email, pass);
    } catch(e) {
        document.getElementById('status').textContent = "Error: " + (e.message.includes('invalid-credential') ? "Correo o contraseña incorrectos" : e.message);
    }
}

window.handleRegister = async () => {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-pass').value;
    
    if(!name || !email || !pass) return alert("Llena todos los campos");
    
    // Validación: mínimo 8 caracteres y al menos una letra (no solo números)
    if (pass.length < 8 || /^\d+$/.test(pass)) {
        return alert("La contraseña debe tener al menos 8 caracteres y no puede ser solo números.");
    }

    document.getElementById('status').textContent = "Creando cuenta...";
    try {
        await registerWithEmail(email, pass, name);
    } catch(e) {
        document.getElementById('status').textContent = "Error: " + (e.message.includes('email-already-in-use') ? "Ese correo ya está registrado" : e.message);
    }
}

window.handleReset = async () => {
    const email = document.getElementById('login-email').value.trim();
    if(!email) return alert("Escribe tu correo arriba primero para enviarte el enlace de recuperación.");
    try {
        await resetPassword(email);
        alert("Te hemos enviado un correo para restablecer tu contraseña. Revisa tu bandeja de entrada o spam.");
    } catch(e) {
        alert("Error: " + e.message);
    }
}

window.handleGoogle = async () => {
    document.getElementById('status').textContent = "Conectando con Google...";
    try { await signInWithGoogle(); }
    catch (e) { document.getElementById('status').textContent = 'Error: ' + (e.message || 'intenta de nuevo'); }
};

watchAuth((user, profile) => {
    if (!user) return;
    document.getElementById('status').textContent = '¡Bienvenido!';
    setTimeout(() => {
        window.location.href = profile?.onboarded ? 'app.html' : 'onboarding.html';
    }, 500);
});
</script>
</body>
</html>
